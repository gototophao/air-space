<path d="M-40 130C120 90 160 190 250 226S390 335 450 300 560 130 690 175"/>
<path d="M-40 157C120 117 160 217 250 253S390 362 450 327 560 157 690 202"/>
<path d="M-40 184C120 144 160 244 250 280S390 389 450 354 560 184 690 229"/>

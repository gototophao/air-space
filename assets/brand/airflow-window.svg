<g fill="#ddf5ab"><circle cx="134" cy="392" r="3"/><circle cx="205" cy="110" r="2"/><circle cx="546" cy="110" r="3"/></g>
<style>
.air-travel{stroke-dasharray:32 170;animation:air-travel 7s linear infinite}
.air-speed-two{animation-duration:9s;animation-delay:-3s;stroke-dasharray:14 185}
.air-speed-three{animation-duration:8s;animation-delay:-5s;stroke-dasharray:3 145;stroke-width:5}
@keyframes air-travel{to{stroke-dashoffset:-808}}
@media(prefers-reduced-motion:reduce){.air-travel{animation:none}}
</style>
</svg>

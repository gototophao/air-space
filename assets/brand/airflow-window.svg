<rect width="640" height="560" rx="6" fill="url(#air-panel)"/>
<g stroke="#79aa96" opacity=".22"><path d="M420 85 590 185v288H420z"/><path d="m420 85-140 89v299h140"/><path d="M280 174 420 272l170-87"/><path d="M420 272v201"/><path d="M475 270v130l65 0V235"/></g>

<path class="flow-trace" d="M-80 670C130 670 75 219 340 219S585 708 833 422 1010 115 1110 70"/>
<path class="flow-trace clay" d="M-80 650C110 650 65 197 340 197S595 684 820 406 990 105 1110 50"/>
</svg>

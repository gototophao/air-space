<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" fill="none">
<title>Air Space — shared air</title>
<style>
.flow-contour{stroke:#a8b99e;stroke-width:1;opacity:.6}
.flow-trace{stroke:#688d75;stroke-width:1.4;stroke-dasharray:6 15;opacity:.6;animation:airflow-drift 26s linear infinite}
.flow-trace.clay{stroke:#b17a55;animation-duration:35s;opacity:.4}
@keyframes airflow-drift{to{stroke-dashoffset:-420}}
@media(prefers-reduced-motion:reduce){.flow-trace{animation:none}}
</style>
